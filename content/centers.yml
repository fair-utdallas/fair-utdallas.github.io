    - { name: Optimization Lab, text: Fundamental algorithms for data subset selection, efficient learning, and model selection. }
    - { name: AI Safety Lab, text: Robust and safe AI methods through responsible machine learning. }
  partners:
    - { name: Cybersecurity Research and Education Institute, text: Robust AI, adversarial machine learning, and security of AI-enabled systems. }
    - { name: Human Language Technology Research Institute, text: Natural language processing, discourse, biomedical language technologies, and language-based reasoning. }
    - { name: Algorithms and Theory Group, text: Basic research in theory and algorithms across a wide range of topics. }
