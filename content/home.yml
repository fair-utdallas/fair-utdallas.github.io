  why_label: Why fundamental AI
  why_title: "Weak foundations\n<em>propagate everywhere.</em>"
  why_lead: "Today's systems <em>hallucinate, fail silently under distribution shift, cannot explain their conclusions, and offer no formal guarantees of safety</em>. These are not application-level bugs to be patched one deployment at a time—they are <em>symptoms of missing science</em>."
  why_detail: A hospital cannot certify a model it cannot verify. A regulator cannot audit a decision process with no interpretable structure. Strengthen the foundations and every system built on them improves at once.
  why_link: Explore the research agenda
