home:
  eyebrow: The University of Texas at Dallas · Est. 2025
  title: "Understanding\n<em>intelligence.</em>\nBuilding what's next."
  intro: FAIR is an umbrella institute for fundamental AI research at UT Dallas—bringing together the people, ideas, and disciplines shaping the future of intelligent systems.
  statement: FAIR advances the fundamental science of AI—unifying learning, reasoning, perception, and language into frameworks that are transparent, scalable, and human-aligned.
  statement_detail: Rooted in the breadth of UT Dallas, FAIR is an umbrella institute spanning learning, reasoning, knowledge representation, planning, and language—the whole of AI, not one corner of it. Founding centers and partner institutes keep their own identity while sharing a single research agenda.
  research_label: Research
  research_title: "Thirteen thrusts.\n<em>One shared agenda.</em>"
  research_intro: From tractable inference to multimodal reasoning, FAIR's agenda spans the full arc of intelligent behavior—learning, reasoning, perception, language, and action.
