home:
  eyebrow: The University of Texas at Dallas · Est. 2025
  title: "Understanding\nintelligence.\nBuilding what’s next."
  intro: FAIR is an umbrella institute for fundamental AI research at UT Dallas—bringing together the people, ideas, and disciplines shaping the future of intelligent systems.
  statement: FAIR brings fundamental questions about intelligence into conversation with the systems we can build.
  statement_detail: Rooted in the breadth of UT Dallas, the institute connects researchers across computer science, engineering, cognitive science, and related fields. Together, we study the foundations of AI and translate insight into responsible progress.
